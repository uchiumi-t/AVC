<!DOCTYPE html>

<head>

<style>

    background: #334155;
    padding: 1.5rem;

    border-radius: 12px;
    border: 2px solid #475569;
    cursor: pointer;
    transition: 0.2s;
    color: white;
  }
  .menu-btn:hover { border-color: var(--primary); background: #1e293b; }
  .header {
    display: flex;
    justify-content: space-between;
    border-bottom: 2px solid #334155;
    padding-bottom: 0.8rem;
    margin-bottom: 1.5rem;
    color: var(--primary);
    font-weight: bold;
  }

    font-size: 1.6rem;
    line-height: 1.5;
    margin-bottom: 2rem;
    min-height: 4em;
    white-space: pre-wrap;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .choice-btn {
    background: #1e293b;
    color: white;
    border: 2px solid #475569;
    padding: 1.2rem;
    font-size: 1.2rem;
    border-radius: 10px;
    cursor: pointer;

    text-align: left;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--primary); }
  .choice-btn.is-correct { background: var(--correct) !important; border-color: #166534 !important; color: white !important; font-weight: bold; transform: scale(1.02); }
  .choice-btn.is-wrong { background: var(--wrong) !important; border-color: #991b1b !important; color: white !important; opacity: 0.8; }
  .choice-btn.is-dimmed { opacity: 0.4; border-color: transparent; }

    border-left: 5px solid var(--primary);
    border-radius: 4px;
    display: none;
  }
  .ans-title { color: var(--primary); font-weight: bold; font-size: 1.4rem; margin-bottom: 0.5rem; }
  .nav { display: flex; justify-content: space-between; margin-top: 2rem; gap: 10px; }
  .nav button { padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; }
  .btn-home { background: #64748b; color: white; }
  .btn-prev, .btn-next { background: var(--primary); color: #0f172a; }
  .btn-ans { background: var(--accent); color: white; }
  .hidden { display: none; }
  #fullscreen-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9999;
    background: #334155;
    border: 2px solid #475569;
    color: var(--primary);

    border-radius: 8px;

const SEC_TITLES = {
  1: "１．可算・不可算名詞と修飾語",
  2: "２．熟語・コロケーションの相性",
  3: "３．類似修飾語の識別"
};

// 表示用の問題リスト（正解位置を割り当てたもの）
let qs = [];
let cur = 0;
let isAnswered = false;

// 正解の位置（A / B）をセクションごとに半々（5問ずつ）にしてシャッフル。
// 同じ位置が4問以上連続しないよう、条件を満たすまで引き直す。
function buildQuestions() {
  let flags;
  do {
    flags = [];
    for (let s = 0; s < DATA.length; s += 10) {
      const n = Math.min(10, DATA.length - s);
      const half = Math.floor(n / 2);
      const sec = Array.from({ length: n }, (_, i) => i < half);   // true = 正解がA
      for (let i = sec.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sec[i], sec[j]] = [sec[j], sec[i]];
      }
      flags = flags.concat(sec);
    }
  } while (hasLongRun(flags, 3));

  qs = DATA.map((d, i) => {
    const correctOnA = flags[i];
    const texts = correctOnA ? [d.a, d.b] : [d.b, d.a];
    const labels = ["A) ", "B) "];
    return {
      n: String(i + 1),
      sec: SEC_TITLES[d.p],
      q: d.q.replace("______", "(　　　)"),
      s: texts.map((t, k) => labels[k] + " " + t),
      a: correctOnA ? 0 : 1,
      label: (correctOnA ? "A) " : "B) ") + " " + d.a,
      e: d.e
    };
  });
}

function hasLongRun(arr, max) {
  let run = 1;
  for (let i = 1; i < arr.length; i++) {
    run = arr[i] === arr[i - 1] ? run + 1 : 1;
    if (run > max) return true;
  }
  return false;
}

function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

function updateFsBtn() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.getElementById('fs-icon').textContent = isFs ? '✕' : '⛶';
  document.getElementById('fs-label').textContent = isFs ? '全画面解除' : '全画面';
}

function startQuiz(index) {
  buildQuestions();   // 開始のたびに正解位置を引き直す
  cur = index;
  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  render();
}

function goHome() {
  document.getElementById('menu-screen').classList.remove('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
}

function render() {
  const item = qs[cur];
  isAnswered = false;
  document.getElementById('q-num').innerText = "Question " + item.n;
  document.getElementById('section-title').innerText = item.sec;
  document.getElementById('q-text').innerText = item.q;
  document.getElementById('explanation').style.display = 'none';
  document.querySelector('.btn-ans').innerHTML = '解答表示 <span style="font-size:0.75em;opacity:0.75;">[Space]</span>';
  document.getElementById('space-hint').textContent = '';

  const choiceArea = document.getElementById('choice-area');
  choiceArea.innerHTML = '';
  item.s.forEach((txt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.id = 'choice-' + i;
    btn.innerText = txt;
    btn.onclick = () => checkAnswer(i);
    choiceArea.appendChild(btn);
  });
}

function checkAnswer(selectedIdx) {
  if (isAnswered) return;
  isAnswered = true;
  const item = qs[cur];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.classList.remove('is-correct', 'is-wrong', 'is-dimmed');
    if (i === item.a) btn.classList.add('is-correct');
    else if (i === selectedIdx) btn.classList.add('is-wrong');
    else btn.classList.add('is-dimmed');
  });
  showAns();
}

function triggerShowAns() {
  const item = qs[cur];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    if (i === item.a) btn.classList.add('is-correct');
    else btn.classList.add('is-dimmed');
  });
  isAnswered = true;
  showAns();
}

function showAns() {
  const item = qs[cur];
  document.getElementById('correct-ans').innerText = item.label;
  document.getElementById('expl-detail').innerText = item.e;
  document.getElementById('explanation').style.display = 'block';
  document.querySelector('.btn-ans').innerHTML = '解答表示';
  document.getElementById('space-hint').textContent = '[Space]';
}

function move(step) {
  cur = (cur + step + qs.length) % qs.length;
  render();
}

document.addEventListener('keydown', function(e) {
  const quizScreen = document.getElementById('quiz-screen');
  if (quizScreen.classList.contains('hidden')) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (!isAnswered) {
      triggerShowAns();
    } else {
      move(1);
    }
    return;
  }
  // 1/2・A/B キーで、画面に表示されている位置の選択肢を選ぶ
  const k = e.key.toLowerCase();
  if (k === '1' || k === 'a') checkAnswer(0);
  else if (k === '2' || k === 'b') checkAnswer(1);
});

buildQuestions();
</script>
</body>
</html>
